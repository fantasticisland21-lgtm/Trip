<style>

.chk{display:flex;align-items:center;gap:8px;margin:10px 0;font-size:16px}

.msheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;overflow-x:hidden;border-radius:18px 18px 0 0;padding:14px 16px calc(env(safe-area-inset-bottom) + 20px)}

.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}

.mact{display:flex;gap:8px;margin-top:16px}
.mact .btn{flex:1}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:24px;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center;font-size:14px}
#toast.show{opacity:1}
#toast.ng{background:var(--ng)}
.auth{max-width:420px;margin:40px auto;padding:0 18px}
.auth h1{text-align:center;margin-bottom:6px}

.opts .chk{margin:4px 0;font-size:15px}
/* ---- しおり ---- */
.sheetwrap{margin-top:10px}
.page{background:#fff;border:1px solid var(--line);border-radius:10px;padding:22px 18px;margin:14px 0;color:var(--ink);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.stitle{font-size:30px;font-weight:700;line-height:1.4;margin:6px 0 14px}
.sprop{display:flex;gap:12px;align-items:baseline;font-size:18px;padding:5px 0}.sprop .k{flex:0 0 6.5em;color:var(--sub);font-size:15px}
.sbox{display:flex;gap:10px;background:#f1f1ef;border-radius:8px;padding:12px 14px;margin:18px 0 0;font-size:18px}.sbox .ic{flex:0 0 auto}
.sbox b{display:block;margin-bottom:2px}
.sday{font-size:24px;font-weight:700;border-bottom:1px solid var(--line);padding-bottom:8px;margin:0 0 12px;display:flex;align-items:center;gap:10px}
.sday span{background:#f1f1ef;color:var(--ink);border-radius:5px;padding:0 10px;font-size:20px}
.sc{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:12px;margin:10px 0;break-inside:avoid;page-break-inside:avoid}
.snum{flex:0 0 30px;height:30px;border-radius:50%;background:#f1f1ef;color:var(--sub);font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center;margin-top:2px}
.stime{flex:0 0 88px;font-size:28px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.stime small{display:block;font-size:14px;font-weight:500;color:var(--sub);margin-top:2px}
.sbody{flex:1;min-width:0;font-size:20px;font-weight:600;word-break:break-word}
.sbody .snote{font-weight:400;font-size:17px;margin-top:4px}
.sbody .smeta{font-weight:400;font-size:14px;margin-top:3px;color:var(--sub)}
.tbdlabel{border:1px dashed #c7c6c4;border-radius:5px;padding:0 6px;font-size:15px;color:var(--sub);font-weight:500}
rt{font-size:.55em}
.sempty{font-size:18px;text-align:center;padding:20px;color:var(--sub)}
@media(max-width:480px){.stime{flex-basis:72px;font-size:24px}.stitle{font-size:26px}.sprop .k{flex-basis:5.5em}}
@media print{
  @page{margin:12mm}
  body{background:#fff;padding:0}
  .noprint,header.top,.side,.tabs,.dhead,#toast,#offline,#modal,.note{display:none!important}
  .wrap{display:block;max-width:none}
  .main{display:block!important;padding:0}
  .sheetwrap{margin:0}

</style>

<body>
<div id="offline">オフラインです。つながると自動で保存されます</div>
<div id="app"><div class="center">読みこみ中…</div></div>
<div id="modal"></div>
<div id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, setDoc, updateDoc, deleteDoc, getDocs, onSnapshot, query, where, serverTimestamp, writeBatch } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCD_oEF8i01mfxVVg09QCp2xpcIgmCmLMI",
  authDomain: "trip-2b366.firebaseapp.com",
  projectId: "trip-2b366",
  storageBucket: "trip-2b366.firebasestorage.app",
  messagingSenderId: "46588245854",
  appId: "1:46588245854:web:2a485019ac623d11af81cf"
};

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
let db;
try { db = initializeFirestore(fbApp, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) }); }
catch (e) { db = getFirestore(fbApp); }

/* ================= 共通 ================= */
const VERSION = 'v11.2';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const WD = ['日','月','火','水','木','金','土'];
const pad = n => String(n).padStart(2,'0');
const pd = s => new Date(s + 'T00:00:00');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays = (s,n) => { const d = pd(s); d.setDate(d.getDate()+n); return ymd(d); };
const diffDays = (a,b) => Math.round((pd(b) - pd(a)) / 86400000);
const fmtD = s => { if (!s) return ''; const d = pd(s); return `${d.getMonth()+1}月${d.getDate()}日(${WD[d.getDay()]})`; };
const rangeDays = (a,b) => { const r = []; if (!a || !b) return r; const n = Math.min(diffDays(a,b), 60); for (let i = 0; i <= n; i++) r.push(addDays(a,i)); return r; };
const today = () => ymd(new Date());
const tt = t => String(t || '').replace(/^0/, '');
const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : '';
const mapLink = e => safeUrl(e.mapUrl) || ((e.address || e.place) ? 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(e.address || e.place) : '');
const aLink = (u, label) => u ? `<a href="${esc(u)}" target="_blank" rel="noopener">${label}</a>` : '';
const parseEmails = s => [...new Set(String(s || '').split(/[\s,、;]+/).map(x => x.trim().toLowerCase()).filter(x => /^\S+@\S+\.\S+$/.test(x)))];
const val = (fd,k) => String(fd.get(k) ?? '').trim();

function toast(msg, ng) {
  const t = $('#toast'); t.textContent = msg; t.className = 'show' + (ng ? ' ng' : '');
  clearTimeout(toast.t); toast.t = setTimeout(() => { t.className = ''; }, ng ? 6000 : 2500);
}
// 書きこみは送信を待たずに画面へ反映される。失敗したときだけ知らせる。
const fire = p => Promise.resolve(p).catch(e => toast('保存できませんでした(' + (e.code || e.message) + ')', true));

const S = {
  ready:false, user:null, email:'', authMode:'login', authErr:'',
  trips:[], tripMap:{parents:[], viewers:[]}, tripId:null,
  tab:'schedule', view:'timeline',
  events:[], cands:[], resvs:[], items:[], itemFilter:'all', gifts:[], giftFilter:'all', expenses:[], expFilter:'all', tasks:[], taskFilter:'todo', taskWho:'',
  unTrips:[], unSub:[],
  sh:{ items:true, ruby:true, place:true, map:false, url:false, rain:false, memo:false, resv:false, resvNo:false, notice:true, people:true }
};
const curTrip = () => S.trips.find(t => t.id === S.tripId);
const isParent = t => !!t && (t.parents || []).includes(S.email);
const evCol = () => collection(db,'trips',S.tripId,'events');
const evRef = id => doc(db,'trips',S.tripId,'events',id);
const cdRef = id => doc(db,'trips',S.tripId,'candidates',id);
const rvRef = id => doc(db,'trips',S.tripId,'reservations',id);
const itRef = id => doc(db,'trips',S.tripId,'items',id);
const gfRef = id => doc(db,'trips',S.tripId,'souvenirs',id);
const exRef = id => doc(db,'trips',S.tripId,'expenses',id);
const tkRef = id => doc(db,'trips',S.tripId,'tasks',id);
const yen = n => '¥' + (Number(n) || 0).toLocaleString('ja-JP');

/* ふりがな: 「漢字{かんじ}」と書くと、しおりでふりがなが付く */
const plain = s => ruby(s, false);
const ruby = (text, on) => esc(text).replace(/([一-鿿々〆ヶ]+)\{([^{}]+)\}/g, on ? '<ruby>$1<rt>$2</rt></ruby>' : '$1').replace(/[{}]/g, '');

/* ================= 認証 ================= */
const AUTHERR = {
  'auth/invalid-email':'メールアドレスの形がちがいます',
  'auth/invalid-credential':'メールアドレスかパスワードがちがいます',
  'auth/user-not-found':'このメールアドレスは登録されていません',
  'auth/wrong-password':'パスワードがちがいます',
  'auth/email-already-in-use':'このメールアドレスはもう登録されています。「ログイン」からどうぞ',
  'auth/weak-password':'パスワードは6文字以上にしてください',
  'auth/network-request-failed':'通信できません。電波を確認してください',
  'auth/too-many-requests':'しばらくたってから、もう一度ためしてください',
  'auth/unauthorized-domain':'このサイトのアドレスがFirebaseに登録されていません(手順の「認証ドメイン」を確認)',
  'auth/operation-not-allowed':'Firebaseで「メール/パスワード」がオンになっていません'
};
onAuthStateChanged(auth, u => {
  S.ready = true; S.user = u; S.email = (u && u.email || '').toLowerCase();
  if (u) subscribeTrips(); else { unsubTrips(); unsubTrip(); S.trips = []; S.tripId = null; }
  render();
});

/* ================= データ購読 ================= */
function unsubTrips() { S.unTrips.forEach(f => f()); S.unTrips = []; }
function unsubTrip() { S.unSub.forEach(f => f()); S.unSub = []; }
function subscribeTrips() {
  unsubTrips(); S.tripMap = {parents:[], viewers:[]};
  for (const role of ['parents','viewers']) {
    const q = query(collection(db,'trips'), where(role,'array-contains',S.email));
    S.unTrips.push(onSnapshot(q, snap => {
      S.tripMap[role] = snap.docs.map(d => ({ id:d.id, ...d.data() }));
      const m = new Map(); [...S.tripMap.viewers, ...S.tripMap.parents].forEach(t => m.set(t.id, t));
      S.trips = [...m.values()].sort((a,b) => (a.start || '').localeCompare(b.start || ''));
      if (S.tripId && !m.has(S.tripId)) { unsubTrip(); S.tripId = null; }
      render();
    }, err => toast('旅行を読みこめません(' + err.code + ')' + (err.code === 'permission-denied' ? '。Firebaseのルールが公開されているか確認してください' : ''), true)));
  }
}
function openTrip(id) {
  unsubTrip(); S.tripId = id; S.tab = 'schedule'; S.events = []; S.cands = []; S.resvs = []; S.items = []; S.gifts = []; S.expenses = []; S.tasks = []; S.taskWho = '';
  const listen = (k, name, tries) => onSnapshot(collection(db,'trips',id,name), snap => {

/* ================= 予定の並び ================= */
const dayEvents = date => S.events.filter(e => e.date === date).sort((a,b) => (a.order ?? 0) - (b.order ?? 0) || String(a.start||'').localeCompare(String(b.start||'')));

}

    if (k >= 0) { const hi = list[k].order ?? 0; const lo = k > 0 ? (list[k-1].order ?? hi - 2000) : hi - 2000; return (lo + hi) / 2; }
  }
  return list.length ? Math.max(...list.map(x => x.order ?? 0)) + 1000 : Date.now();
}

  if (j < 0 || j >= list.length) return;
  const a = list[i], b = list[j]; const oa = a.order ?? 0, ob = b.order ?? 0;
  if (oa === ob) fire(updateDoc(evRef(a.id), { order: oa + (dir > 0 ? 1 : -1) * 0.5 }));
  else { fire(updateDoc(evRef(a.id), { order: ob })); fire(updateDoc(evRef(b.id), { order: oa })); }
}

  const b = writeBatch(db); list.forEach((e,i) => b.update(evRef(e.id), { order: (i + 1) * 1000 }));

}

/* ---- 予算・支出 ---- */
// お土産はお土産リストの金額をそのまま使う(支出には入れないので二重に数えない)
const ECAT = [['move','🚃 交通'],['stay','🏨 宿泊'],['ticket','🎫 チケット・入場'],['food','🍽 食事'],['gift','🎁 お土産'],['other','📦 その他']];
const ECATL = Object.fromEntries(ECAT);
const num = v => (v === '' || v == null || isNaN(Number(v))) ? null : Math.max(0, Math.round(Number(v)));
function budgetCalc(t) {
  const b = t.budget || {}; const bc = b.cats || {};
  const cats = ECAT.map(([k,l]) => {
    let paid = 0, plan = 0;
    if (k === 'gift') S.gifts.forEach(g => { const p = Number(g.price) || 0; if (g.bought) paid += p; else plan += p; });
    else S.expenses.filter(x => (ECATL[x.cat] && x.cat !== 'gift' ? x.cat : 'other') === k).forEach(x => { const a = Number(x.amount) || 0; if (x.paid) paid += a; else plan += a; });
    return { k, l, paid, plan, bud: num(bc[k]) };
  });
  const paid = cats.reduce((a,c) => a + c.paid, 0), plan = cats.reduce((a,c) => a + c.plan, 0);
  const catSum = cats.reduce((a,c) => a + (c.bud || 0), 0);
  const total = num(b.total) ?? (catSum ? catSum : null);
  return { cats, paid, plan, total };
}
const pbar = (paid, plan, total, small) => { const m = Math.max(total || 0, paid + plan, 1); return `<div class="pbar ${small ? 'small' : ''}"><i class="p1" style="width:${paid / m * 100}%"></i><i class="p2" style="width:${plan / m * 100}%"></i></div>`; };
function budgetHTML(t, par) {
  const c = budgetCalc(t); const left = c.total == null ? null : c.total - c.paid - c.plan;
  const f = S.expFilter;
  const list = S.expenses.slice().sort((a,b) => String(a.date || '').localeCompare(String(b.date || '')) || (a.order ?? 0) - (b.order ?? 0));
  const shown = f === 'todo' ? list.filter(x => !x.paid) : f === 'done' ? list.filter(x => x.paid) : list;
  const seg = [['all','すべて'],['todo','これから払う'],['done','払った']].map(([k,l]) => `<button class="${f === k ? 'on' : ''}" data-a="filterExp" data-v="${k}">${l}</button>`).join('');
  const crow = x => { const used = x.paid + x.plan; const r = x.bud == null ? null : x.bud - used;
    return `<div class="crow"><div class="ch"><span>${x.l}</span><span>${yen(used)}${x.bud != null ? ` <span class="sub">/ ${yen(x.bud)}</span>` : ''}</span></div>
     ${x.bud != null || used ? pbar(x.paid, x.plan, x.bud, true) : ''}
     <div class="sub">${x.k === 'gift' ? 'お土産リストから ・ ' : ''}払った ${yen(x.paid)}・これから ${yen(x.plan)}${r != null ? `・<span class="${r < 0 ? 'neg' : ''}">${r < 0 ? 'オーバー ' + yen(-r) : '残り ' + yen(r)}</span>` : ''}</div></div>`; };
  return `<div class="bar"><h2>予算と支出</h2>${par ? '<button class="btn" data-a="addExp">＋支出</button>' : ''}</div>
   <div class="card">${c.total == null ? `<div class="sub">予算はまだ決めていません</div>` : ''}
    <div class="bsum">
     <div><span class="sub">予算</span><b>${c.total == null ? '未設定' : yen(c.total)}</b></div>
     <div><span class="sub">残りの見込み</span><b class="${left != null && left < 0 ? 'neg' : ''}">${left == null ? '-' : (left < 0 ? '−' + yen(-left) : yen(left))}</b></div>
     <div><span class="sub">払った</span><b>${yen(c.paid)}</b></div>
     <div><span class="sub">これから払う</span><b>${yen(c.plan)}</b></div>
    </div>
    ${pbar(c.paid, c.plan, c.total)}<div class="legend"><i style="background:var(--acc);margin-left:0"></i>払った<i style="background:#a8cdef"></i>これから払う</div>
    ${left != null && left < 0 ? '<div class="sub neg" style="margin-top:4px">予算をこえています</div>' : ''}
    ${par ? `<div class="eact"><button class="mini" data-a="editBudget">${c.total == null ? '予算を決める' : '予算を変える'}</button></div>` : ''}</div>
   <div class="card"><h2>種類ごと</h2>${c.cats.map(crow).join('')}</div>
   <div class="sub">お土産はお土産リストの金額を使います(買った=払った、まだ=これから)。お土産をここに入れる必要はありません。</div>
   <div class="bar"><div class="seg">${seg}</div></div>
   ${shown.length ? shown.map(x => { const rv = S.resvs.find(r => r.id === x.resvId);
    return `<div class="item ${x.paid ? '' : ''}"><button class="ck" data-a="toggleExp" data-id="${x.id}" aria-label="払った" ${par ? '' : 'disabled'} style="${x.paid ? 'background:var(--acc);border-color:var(--acc)' : ''}">${x.paid ? '✓' : ''}</button>
     <div class="ib"><div class="ett">${esc(x.title)} ${x.fromResv ? '<span class="tag">予約から</span>' : ''}<span class="tag ${x.paid ? 'ok' : 'warn'}">${x.paid ? '払った' : 'これから'}</span></div>
      <div class="sub">${ECATL[x.cat] && x.cat !== 'gift' ? ECATL[x.cat] : ECATL.other}・${x.date ? fmtD(x.date) : '旅行前・日付なし'}${x.payer ? '・👤 ' + esc(x.payer) : ''}</div>
      ${rv ? `<div class="sub">🎫 ${esc(rv.target)}</div>` : ''}${x.memo ? `<div class="sub">${esc(x.memo)}</div>` : ''}</div>
     <div class="amt">${yen(x.amount)}</div>
     ${par ? `<button class="mini" data-a="editExp" data-id="${x.id}">編集</button>` : ''}</div>`; }).join('') : `<div class="empty">${list.length ? 'この中には支出がありません' : 'まだ支出がありません。<br>「＋支出」から、ホテル代やチケット代などを入れましょう'}</div>`}`;

   ${inp('total','旅行全体の予算(円)',b.total ?? '','number','min="0" inputmode="numeric"')}

function confirmModal(title, msg, action, id) {
  openModal(title, `<p>${esc(msg)}</p><div class="mact"><button class="btn ghost" type="button" data-a="mclose">やめる</button><button class="btn ng" type="button" data-a="${action}" data-id="${id}">削除する</button></div>`);
}

/* ================= フォーム送信 ================= */
const submitters = {
  async auth(fd) {
    const email = val(fd,'email'), pw = String(fd.get('pw') || ''); S.authErr = '';
    try { if (S.authMode === 'login') await signInWithEmailAndPassword(auth, email, pw); else await createUserWithEmailAndPassword(auth, email, pw); }
    catch (e) { S.authErr = AUTHERR[e.code] || ('エラー: ' + (e.code || e.message)); render(); }
  },
  trip(fd, f) {
    const id = f.dataset.id; const start = val(fd,'start'), end = val(fd,'end');
    if (end < start) return toast('帰宅日は出発日より後にしてください', true);
    const parents = parseEmails(val(fd,'parents')); if (!parents.includes(S.email)) parents.push(S.email);
    const viewers = parseEmails(val(fd,'viewers')).filter(x => !parents.includes(x));
    const data = { name: val(fd,'name'), dest: val(fd,'dest'), start, end, people: val(fd,'people'), notice: val(fd,'notice'), memo: val(fd,'memo'), parents, viewers };
    if (id) fire(updateDoc(doc(db,'trips',id), data));
    else {
      const ref = doc(collection(db,'trips')); let failed = false; closeModal(); toast('保存しています…');
      const w = setDoc(ref, { ...data, createdBy: S.email, createdAt: serverTimestamp() })
        .catch(e => { failed = true; toast('保存できませんでした(' + (e.code || e.message) + ')' + (e.code === 'permission-denied' ? '。Firebaseのルールが公開されているか確認してください' : ''), true); });
      Promise.race([w, new Promise(r => setTimeout(r, 4000))]).then(() => { if (!failed) { openTrip(ref.id); toast('保存しました'); } });
      return;
    }
    closeModal(); toast('保存しました');
  },
  ev(fd, f) {
    const id = f.dataset.id; const old = id ? S.events.find(x => x.id === id) : null;
    const date = val(fd,'date'), start = val(fd,'start');
    const data = { date, start, end: val(fd,'end'), title: val(fd,'title'), confirmed: fd.get('confirmed') === 'on', place: val(fd,'place'), address: val(fd,'address'), url: val(fd,'url'), mapUrl: val(fd,'mapUrl'), resvId: val(fd,'resvId'), memo: val(fd,'memo'), rainPlan: val(fd,'rainPlan'), kidTitle: val(fd,'kidTitle'), kidNote: val(fd,'kidNote') };
    data.order = (old && old.date === date && (old.start || '') === start && old.order != null) ? old.order : placeOrder(date, start, id);
    if (id) fire(updateDoc(evRef(id), data)); else fire(setDoc(doc(evCol()), data));
    closeModal(); toast('保存しました');
  },
  cand(fd, f) {
    const id = f.dataset.id; const data = { name: val(fd,'name'), url: val(fd,'url'), mapUrl: val(fd,'mapUrl'), date: val(fd,'date'), status: val(fd,'status'), memo: val(fd,'memo') };
    if (id) fire(updateDoc(cdRef(id), data)); else fire(setDoc(doc(collection(db,'trips',S.tripId,'candidates')), data));
    closeModal(); toast('保存しました');
  },
  resv(fd, f) {
    const id = f.dataset.id; const amount = num(val(fd,'amount')); const target = val(fd,'target');
    const data = { target, vendor: val(fd,'vendor'), reservedOn: val(fd,'reservedOn'), useAt: val(fd,'useAt'), number: val(fd,'number'), url: val(fd,'url'), memo: val(fd,'memo'), amount, cat: amount == null ? '' : (val(fd,'cat') || guessCat(target)), paid: fd.get('paid') === 'on' };
    const ref = id ? rvRef(id) : doc(collection(db,'trips',S.tripId,'reservations'));
    if (id) fire(updateDoc(ref, data)); else fire(setDoc(ref, data));
    syncResvExpense(ref.id, data);
    closeModal(); toast(amount != null ? '保存しました(予算にも入れました)' : '保存しました');
  },
  item(fd, f) {
    const id = f.dataset.id; const data = { name: val(fd,'name'), qty: Math.max(1, Number(val(fd,'qty')) || 1), assignee: val(fd,'assignee'), memo: val(fd,'memo') };
    if (id) fire(updateDoc(itRef(id), data)); else fire(setDoc(doc(collection(db,'trips',S.tripId,'items')), { ...data, done: false, order: Date.now() }));
    closeModal(); toast('保存しました');
  },
  gift(fd, f) {
    const id = f.dataset.id; const p = val(fd,'price');
    const data = { to: val(fd,'to'), item: val(fd,'item'), price: p === '' ? null : Math.max(0, Number(p) || 0), memo: val(fd,'memo'), bought: fd.get('bought') === 'on' };
    if (id) fire(updateDoc(gfRef(id), data)); else fire(setDoc(doc(collection(db,'trips',S.tripId,'souvenirs')), { ...data, order: Date.now() }));
    closeModal(); toast('保存しました');
  },
  budget(fd) {
    const cats = {}; ECAT.forEach(([k]) => { const v = num(val(fd,'c_' + k)); if (v != null) cats[k] = v; });
    fire(updateDoc(doc(db,'trips',S.tripId), { budget: { total: num(val(fd,'total')), cats } }));
    closeModal(); toast('保存しました');
  },
  exp(fd, f) {
    const id = f.dataset.id; const cat = val(fd,'cat') || 'other'; S.lastCat = cat;
    const data = { title: val(fd,'title'), amount: num(val(fd,'amount')) ?? 0, cat, paid: fd.get('paid') === 'on', date: val(fd,'date'), payer: val(fd,'payer'), resvId: val(fd,'resvId'), memo: val(fd,'memo') };
    if (id) fire(updateDoc(exRef(id), data)); else fire(setDoc(doc(collection(db,'trips',S.tripId,'expenses')), { ...data, order: Date.now() }));
    closeModal(); toast('保存しました');
  },
  task(fd, f) {
    const id = f.dataset.id; const data = { title: val(fd,'title'), due: val(fd,'due'), assignee: val(fd,'assignee'), memo: val(fd,'memo'), done: fd.get('done') === 'on' };
    if (id) fire(updateDoc(tkRef(id), data)); else fire(setDoc(doc(collection(db,'trips',S.tripId,'tasks')), { ...data, order: Date.now() }));
    closeModal(); toast('保存しました');
  },
  taskquick(fd, f) {
    const title = val(fd,'title'); if (!title) return;
    fire(setDoc(doc(collection(db,'trips',S.tripId,'tasks')), { title, due: '', assignee: '', memo: '', done: false, order: Date.now() })); f.reset();
  },
  tasktpl(fd) {
    const t = curTrip(); const have = new Set(S.tasks.map(x => x.title)); const b = writeBatch(db); let n = 0, o = Date.now();
    TPL.forEach(([title, off], i) => { if (fd.get('tp' + i) !== 'on' || have.has(title)) return; b.set(doc(collection(db,'trips',S.tripId,'tasks')), { title, due: tplDue(t, off), assignee: '', memo: '', done: false, order: o++ }); n++; });
    closeModal(); if (!n) return toast('追加するものがありませんでした');
    fire(b.commit()); toast(n + '件追加しました(期限はあとで変えられます)');
  },
  rename(fd) {
    const name = val(fd,'name'); if (!name) return;
    fire(updateDoc(doc(db,'trips',S.tripId), { name })); closeModal(); toast('名前を変えました');
  },
  itemquick(fd, f) {
    const name = val(fd,'name'); if (!name) return;
    fire(setDoc(doc(collection(db,'trips',S.tripId,'items')), { name, qty: 1, assignee: '', memo: '', done: false, order: Date.now() })); f.reset();
  },
  dup(fd, f) {
    const id = f.dataset.id; const name = val(fd,'name'), start = val(fd,'start');
    closeModal(); toast('複製しています…'); duplicateTrip(id, name, start);
  }
};
document.addEventListener('submit', e => { e.preventDefault(); const f = e.target; const fn = submitters[f.dataset.f]; if (fn) fn(new FormData(f), f); });

/* ================= 複製・削除・書き出し ================= */
async function duplicateTrip(srcId, name, newStart) {
  try {
    const src = S.trips.find(t => t.id === srcId); const off = diffDays(src.start, newStart); const dur = diffDays(src.start, src.end);
    const nref = doc(collection(db,'trips')); const b = writeBatch(db);
    const parents = [...new Set([...(src.parents || []), S.email])];
    b.set(nref, { name, dest: src.dest || '', start: newStart, end: addDays(newStart, dur), people: src.people || '', notice: src.notice || '', memo: src.memo || '', ...(src.budget ? { budget: src.budget } : {}), parents, viewers: src.viewers || [], createdBy: S.email, createdAt: serverTimestamp() });
    const [es, cs, its, tks] = await Promise.all([getDocs(collection(db,'trips',srcId,'events')), getDocs(collection(db,'trips',srcId,'candidates')), getDocs(collection(db,'trips',srcId,'items')), getDocs(collection(db,'trips',srcId,'tasks'))]);
    tks.docs.forEach(d => { const x = d.data(); b.set(doc(collection(db,'trips',nref.id,'tasks')), { ...x, done: false, due: x.due ? addDays(x.due, off) : '' }); });
    its.docs.forEach(d => { b.set(doc(collection(db,'trips',nref.id,'items')), { ...d.data(), done: false }); });
    es.docs.forEach(d => { const x = d.data(); b.set(doc(collection(db,'trips',nref.id,'events')), { ...x, date: addDays(x.date, off), resvId: '' }); });
    cs.docs.forEach(d => { const x = d.data(); b.set(doc(collection(db,'trips',nref.id,'candidates')), { ...x, date: x.date ? addDays(x.date, off) : '', status: 'consider' }); });
    await b.commit(); toast('複製しました'); openTrip(nref.id);
  } catch (e) { toast('複製できませんでした(' + (e.code || e.message) + ')', true); }
}
async function deleteTrip(id) {
  try {
    toast('削除しています…');
    for (const n of ['events','candidates','reservations','items','souvenirs','expenses','tasks']) {
      const snap = await getDocs(collection(db,'trips',id,n)); const b = writeBatch(db); snap.docs.forEach(d => b.delete(d.ref)); await b.commit();
    }
    await deleteDoc(doc(db,'trips',id));
    if (S.tripId === id) closeTrip(); toast('削除しました');
  } catch (e) { toast('削除できませんでした(' + (e.code || e.message) + ')', true); }
}
function exportJson() {
  const t = curTrip(); const strip = o => { const { id, ...r } = o; return { id, ...r }; };
  const data = { exportedAt: new Date().toISOString(), trip: strip({ ...t, createdAt: undefined }), events: S.events, candidates: S.cands, reservations: S.resvs, items: S.items, souvenirs: S.gifts, expenses: S.expenses, tasks: S.tasks };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `trip-${t.name}.json`; document.body.appendChild(a); a.click(); a.remove();
}

/* ================= クリック処理 ================= */
const H = {
  authMode() { S.authMode = S.authMode === 'login' ? 'signup' : 'login'; S.authErr = ''; render(); },
  async resetPw() {
    const email = (document.querySelector('input[name=email]') || {}).value;
    if (!email) return toast('先にメールアドレスを入れてください', true);
    try { await sendPasswordResetEmail(auth, email); toast('再設定のメールを送りました'); } catch (e) { toast(AUTHERR[e.code] || e.code, true); }
  },
  logout() { signOut(auth); },
  openTrip(d) { openTrip(d.id); },
  closeTrip() { closeTrip(); },
  newTrip() { tripForm(null); },
  editTrip() { tripForm(curTrip()); },
  renameTrip() { const t = curTrip(); openModal('旅行の名前を変える', `<form data-f="rename">${inp('name','旅行の名前',t.name,'text','required')}${acts('保存する')}</form>`); setTimeout(() => { const i = document.querySelector('#modal input[name=name]'); if (i) { i.focus(); i.select(); } }, 50); },
  dupTrip(d) {
    const t = S.trips.find(x => x.id === d.id);

     ${inp('name','新しい旅行名', t.name + '(コピー)','text','required')}${inp('start','新しい出発日','', 'date','required')}${acts('複製する')}</form>`);
  },
  delTrip(d) { const t = S.trips.find(x => x.id === d.id); confirmModal('旅行を削除', `「${t.name}」を削除します。予定・予約などもすべて消えて、元にもどせません。`, 'doDelTrip', d.id); },
  doDelTrip(d) { closeModal(); deleteTrip(d.id); },
  tab(d) { S.tab = d.t; render(); window.scrollTo(0,0); },
  view(d) { S.view = d.v; render(); },
  addEv(d) { evForm(null, d.d); },
  editEv(d) { evForm(d.id); },
  dupEv(d) {
    const e = S.events.find(x => x.id === d.id); const list = dayEvents(e.date); const i = list.findIndex(x => x.id === d.id); const next = list[i + 1];
    const { id, ...rest } = e; const order = next ? ((e.order ?? 0) + (next.order ?? 0)) / 2 : (e.order ?? 0) + 1000;
    fire(setDoc(doc(evCol()), { ...rest, title: e.title + '(コピー)', order })); toast('複製しました');
  },
  moveEv(d) { moveEv(d.id, Number(d.dir)); },
  sortDay(d) { sortDay(d.d); },
  delEv(d) { closeModal(); fire(deleteDoc(evRef(d.id))); toast('削除しました'); },
  addCand() { candForm(null); },
  editCand(d) { candForm(d.id); },
  delCand(d) { closeModal(); fire(deleteDoc(cdRef(d.id))); toast('削除しました'); },
  candToEv(d) {
    const t = curTrip(); const c = S.cands.find(x => x.id === d.id); const date = c.date || t.start;
    fire(setDoc(doc(evCol()), { date, start:'', end:'', title: c.name, confirmed:false, place: c.name, address:'', url: c.url || '', mapUrl: c.mapUrl || '', resvId:'', memo: c.memo || '', rainPlan:'', kidTitle:'', kidNote:'', order: placeOrder(date, '') }));
    fire(updateDoc(cdRef(c.id), { status: 'adopt' })); toast(`${fmtD(date)}の予定に追加しました(時刻は未確定)`);
  },
  addResv() { resvForm(null); },
  editResv(d) { resvForm(d.id); },
  delResv(d) { closeModal(); fire(deleteDoc(rvRef(d.id))); if (S.expenses.some(x => x.id === rexId(d.id))) fire(deleteDoc(exRef(rexId(d.id)))); toast('削除しました'); },
  filterItems(d) { S.itemFilter = d.v; render(); },
  toggleItem(d) { const it = S.items.find(x => x.id === d.id); if (it) fire(updateDoc(itRef(d.id), { done: !it.done })); },
  addItem() { itemForm(null); },
  editItem(d) { itemForm(d.id); },
  delItem(d) { closeModal(); fire(deleteDoc(itRef(d.id))); toast('削除しました'); },
  copyItemsModal() {
    const others = S.trips.filter(t => t.id !== S.tripId);
    openModal('他の旅行から持ち物をコピー', others.length ? `<div class="sub">コピー元の旅行をえらんでください(同じ名前の持ち物はコピーしません)</div>` + others.map(t => `<div class="card tcard" data-a="copyItems" data-id="${t.id}"><h2>${esc(t.name)}</h2><div class="sub">${fmtD(t.start)}〜${fmtD(t.end)}</div></div>`).join('') : '<p>ほかの旅行がありません</p>');
  },
  async copyItems(d) {
    closeModal();
    try {
      const snap = await getDocs(collection(db,'trips',d.id,'items')); const have = new Set(S.items.map(i => i.name)); let n = 0; const b = writeBatch(db); let t = Date.now();
      snap.docs.map(x => x.data()).sort((a,b2) => (a.order ?? 0) - (b2.order ?? 0)).forEach(x => { if (have.has(x.name)) return; b.set(doc(collection(db,'trips',S.tripId,'items')), { ...x, done: false, order: t++ }); n++; });
      if (!n) return toast('コピーする持ち物がありませんでした');
      await b.commit(); toast(n + '個コピーしました');
    } catch (e) { toast('コピーできませんでした(' + (e.code || e.message) + ')', true); }
  },
  filterGifts(d) { S.giftFilter = d.v; render(); },
  toggleGift(d) { const g = S.gifts.find(x => x.id === d.id); if (g) fire(updateDoc(gfRef(d.id), { bought: !g.bought })); },
  addGift() { giftForm(null); },
  editGift(d) { giftForm(d.id); },
  delGift(d) { closeModal(); fire(deleteDoc(gfRef(d.id))); toast('削除しました'); },
  filterTasks(d) { S.taskFilter = d.v; render(); },
  taskWho(d) { S.taskWho = d.v; render(); },
  toggleTask(d) { const x = S.tasks.find(e => e.id === d.id); if (x) fire(updateDoc(tkRef(d.id), { done: !x.done })); },
  editTask(d) { taskForm(d.id); },
  delTask(d) { closeModal(); fire(deleteDoc(tkRef(d.id))); toast('削除しました'); },
  taskTplModal() {
    const t = curTrip(); const have = new Set(S.tasks.map(x => x.title));
    openModal('よくある準備から追加', `<form data-f="tasktpl"><div class="sub">追加したいものにチェックしてください。期限は出発日から自動で入れます(あとで変えられます)。</div>
     <div class="tplist">${TPL.map(([title, off], i) => `<label class="chk"><input type="checkbox" name="tp${i}" ${have.has(title) ? 'disabled' : ''}><div>${esc(title)}<div class="sub">${have.has(title) ? '追加ずみ' : t.start ? fmtD(tplDue(t, off)) + 'まで' : ''}</div></div></label>`).join('')}</div>
     ${acts('追加する')}</form>`);
  },
  filterExp(d) { S.expFilter = d.v; render(); },
  toggleExp(d) { const x = S.expenses.find(e => e.id === d.id); if (!x) return; fire(updateDoc(exRef(d.id), { paid: !x.paid })); if (x.fromResv && S.resvs.some(r => r.id === x.resvId)) fire(updateDoc(rvRef(x.resvId), { paid: !x.paid })); },
  addExp() { expForm(null); },
  editExp(d) { const x = S.expenses.find(e => e.id === d.id); if (x && x.fromResv && S.resvs.some(r => r.id === x.resvId)) { resvForm(x.resvId); toast('予約から入った支出は、予約の画面で直します'); } else expForm(d.id); },
  delExp(d) { closeModal(); fire(deleteDoc(exRef(d.id))); toast('削除しました'); },
  editBudget() { budgetForm(); },
  print() { window.print(); },
  exportJson() { exportJson(); },
  mclose(d, b, e) { if (b.classList.contains('mback') && e.target !== b) return; closeModal(); }
};

  const b = e.target.closest('[data-a]'); if (!b) return;
