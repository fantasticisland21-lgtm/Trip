const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const WD = ['日','月','火','水','木','金','土'];
const pad = n => String(n).padStart(2,'0');
const pd = s => new Date(s + 'T00:00:00');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays = (s,n) => { const d = pd(s); d.setDate(d.getDate()+n); return ymd(d); };
const diffDays = (a,b) => Math.round((pd(b) - pd(a)) / 86400000);
const fmtD = s => { if (!s) return ''; const d = pd(s); return `${d.getMonth()+1}月${d.getDate()}日(${WD[d.getDay()]})`; };
const rangeDays = (a,b) => { const r = []; if (!a || !b) return r; const n = Math.min(diffDays(a,b), 60); for (let i = 0; i <= n; i++) r.push(addDays(a,i)); return r; };

const aLink = (u, label) => u ? `<a href="${esc(u)}" target="_blank" rel="noopener">${label}</a>` : '';
const parseEmails = s => [...new Set(String(s || '').split(/[\s,、;]+/).map(x => x.trim().toLowerCase()).filter(x => /^\S+@\S+\.\S+$/.test(x)))];

function toast(msg, ng) {
  const t = $('#toast'); t.textContent = msg; t.className = 'show' + (ng ? ' ng' : '');
  clearTimeout(toast.t); toast.t = setTimeout(() => { t.className = ''; }, ng ? 6000 : 2500);

const fire = p => Promise.resolve(p).catch(e => toast('保存できませんでした(' + (e.code || e.message) + ')', true));

const S = {

function unsubTrips() { S.unTrips.forEach(f => f()); S.unTrips = []; }

function subscribeTrips() {
  unsubTrips(); S.tripMap = {parents:[], viewers:[]};
  for (const role of ['parents','viewers']) {
    const q = query(collection(db,'trips'), where(role,'array-contains',S.email));
    S.unTrips.push(onSnapshot(q, snap => {
      S.tripMap[role] = snap.docs.map(d => ({ id:d.id, ...d.data() }));
      const m = new Map(); [...S.tripMap.viewers, ...S.tripMap.parents].forEach(t => m.set(t.id, t));
      S.trips = [...m.values()].sort((a,b) => (a.start || '').localeCompare(b.start || ''));
      S.tripsLoaded = true; refreshDevice();
      if (S.tripId && !m.has(S.tripId)) { unsubTrip(); S.tripId = null; }
      render();
    }, err => toast('旅行を読みこめません(' + err.code + ')' + (err.code === 'permission-denied' ? '。Firebaseのルールが公開されているか確認してください' : ''), true)));

function openTrip(id) {

    S[k] = snap.docs.map(d => ({ id:d.id, ...d.data() })); render();
  }, err => {

const dayEvents = date => S.events.filter(e => e.date === date).sort((a,b) => (a.order ?? 0) - (b.order ?? 0) || String(a.start||'').localeCompare(String(b.start||'')));
function allDays(t) {
  const set = new Set(rangeDays(t.start, t.end)); S.events.forEach(e => e.date && set.add(e.date));
  return [...set].sort();
}
function placeOrder(date, start, exId) {
  const list = dayEvents(date).filter(x => x.id !== exId);
  if (start) {
    const k = list.findIndex(x => x.start && x.start > start);
    if (k >= 0) { const hi = list[k].order ?? 0; const lo = k > 0 ? (list[k-1].order ?? hi - 2000) : hi - 2000; return (lo + hi) / 2; }
  }
  return list.length ? Math.max(...list.map(x => x.order ?? 0)) + 1000 : Date.now();
}
function moveEv(id, dir) {
  const e = S.events.find(x => x.id === id); if (!e) return;
  const list = dayEvents(e.date); const i = list.findIndex(x => x.id === id); const j = i + dir;
  if (j < 0 || j >= list.length) return;
  const a = list[i], b = list[j]; const oa = a.order ?? 0, ob = b.order ?? 0;
  if (oa === ob) fire(updateDoc(evRef(a.id), { order: oa + (dir > 0 ? 1 : -1) * 0.5 }));
  else { fire(updateDoc(evRef(a.id), { order: ob })); fire(updateDoc(evRef(b.id), { order: oa })); }
}
function sortDay(date) {
  const list = dayEvents(date).slice().sort((a,b) => (a.start ? 0 : 1) - (b.start ? 0 : 1) || String(a.start||'').localeCompare(String(b.start||'')));
  const b = writeBatch(db); list.forEach((e,i) => b.update(evRef(e.id), { order: (i + 1) * 1000 }));
  fire(b.commit()); toast('時刻の順に並べました');
}

function setApp(el, html) {

const nodeKey = n => n.nodeType !== 1 ? '#' + n.nodeType : n.nodeName + '|' + (n.getAttribute('data-f') || '') + '|' + (n.getAttribute('name') || '') + '|' + (n.getAttribute('type') || '');
function morph(from, to) {
  const a = [...from.childNodes], b = [...to.childNodes];
  b.forEach((n, i) => {
    const o = a[i];
    if (!o) return from.appendChild(n);
    if (nodeKey(o) !== nodeKey(n)) return from.replaceChild(n, o);
    if (o.nodeType !== 1) { if (o.nodeValue !== n.nodeValue) o.nodeValue = n.nodeValue; return; }
    patchEl(o, n);
  });
  for (let i = b.length; i < a.length; i++) a[i].remove();
}
function patchEl(o, n) {
  for (const at of [...o.attributes]) if (!n.hasAttribute(at.name)) o.removeAttribute(at.name);
  for (const at of [...n.attributes]) if (o.getAttribute(at.name) !== at.value) o.setAttribute(at.name, at.value);
  const tag = o.nodeName, focused = o === document.activeElement;
  if (tag === 'INPUT' && (o.type === 'checkbox' || o.type === 'radio')) { o.checked = n.hasAttribute('checked'); return; }
  if (tag === 'INPUT' || tag === 'TEXTAREA') return; // 入力中の文字はそのまま残す
  if (tag === 'SELECT') {
    const sel = n.querySelector('option[selected]'); const v = sel ? sel.value : (n.options[0] ? n.options[0].value : '');
    morph(o, n); if (!focused) o.value = v; return;
  }
  morph(o, n);
}

/* ---- 持ち物 ---- */
/* 持ち物: isBag=true のものが「かばん」。bag に入れ先のかばんのIDを入れる。かばんの中にかばんも入れられる(何段でも) */
const sortOrd = (a,b) => (a.order ?? 0) - (b.order ?? 0);
function itemTree() {
  const list = S.items.slice().sort(sortOrd); const bagIds = new Set(list.filter(i => i.isBag).map(i => i.id));
  const byId = new Map(list.map(i => [i.id, i]));
  // 入れ先をたどって、ぐるぐる(AがBの中、BがAの中)になるものは一番外に出して表示する
  const loops = id => { const vis = new Set(); let cur = byId.get(id); while (cur && cur.bag && bagIds.has(cur.bag)) { if (vis.has(cur.id)) return true; vis.add(cur.id); cur = byId.get(cur.bag); } return false; };
  const parentOf = i => (i.bag && bagIds.has(i.bag) && i.bag !== i.id && !loops(i.id)) ? i.bag : '';
  const kids = id => list.filter(i => parentOf(i) === id);
  const roots = list.filter(i => !parentOf(i));
  const desc = id => { const out = []; const st = [id], vis = new Set([id]); while (st.length) { const x = st.pop(); list.filter(i => parentOf(i) === x && !vis.has(i.id)).forEach(c => { vis.add(c.id); out.push(c); st.push(c.id); }); } return out; };
  return { list, roots, kids, desc };
}
const isCar = i => !!(i && i.isBag && i.kind === 'car');
// 車は🚗、車の中や一番外のかばんは🧳、かばんの中のかばんは👝
const bagMark = b => isCar(b) ? '🚗 ' : S.items.some(x => x.isBag && !isCar(x) && x.id === b.bag) ? '👝 ' : '🧳 ';
const bagIcon = (i, depth) => i.isBag ? bagMark(i) : '';
// ポーチ(かばんの中のかばん)は見出しにせず、入っているかばんの一覧の中に段にして出す
const isPouch = b => b.isBag && bagMark(b) === '👝 ';
function bagPath(id, raw) { const names = [], vis = new Set(); let cur = S.items.find(x => x.id === id); while (cur && !vis.has(cur.id)) { vis.add(cur.id); names.unshift(raw ? rawName(cur.name) : plain(cur.name)); cur = S.items.find(x => x.id === cur.bag && x.isBag); } return names.join(' › '); }
// 入れ物を「車 → その中のかばん → さらに中のかばん…」の順に並べる
function containerOrder() {
  const { roots, kids } = itemTree(); const out = [], seen = new Set();
  const go = b => { if (seen.has(b.id)) return; seen.add(b.id); if (!isPouch(b)) out.push(b); kids(b.id).filter(x => x.isBag).forEach(go); };
  roots.filter(isCar).forEach(go); roots.filter(r => r.isBag && !isCar(r)).forEach(go);
  const key = (c, i) => c.secOrder ?? (1e9 + i);
  return out.map((c, i) => [c, key(c, i)]).sort((a,b) => a[1] - b[1]).map(x => x[0]);
}
function itemsHTML(par) {
  const { list, roots, kids, desc } = itemTree();
  const bags = list.filter(i => i.isBag);
  if (S.itemBag && !bags.some(b => b.id === S.itemBag)) S.itemBag = '';
  const todo = S.itemFilter === 'todo';
  const visible = i => !todo || !i.done || desc(i.id).some(x => !x.done);
  const row = (i, depth) => { const n = i.isBag ? desc(i.id).filter(x => !x.isBag) : null;
    return `<div class="item ${i.isBag ? 'bag' : ''} ${i.done ? 'done' : ''}" style="${depth ? `margin-left:${depth * 24}px` : ''}"><button class="ck" data-a="toggleItem" data-id="${i.id}" aria-label="準備できた" ${par ? '' : 'disabled'}>${i.done ? '✓' : ''}</button>
     <div class="ib"><div class="ett">${bagIcon(i, depth)}${plain(i.name)}${n && n.length ? ` <span class="sub">${n.filter(x => x.done).length}/${n.length}</span>` : ''}</div>${i.memo ? `<div class="sub">${esc(i.memo)}</div>` : ''}</div>
     ${par ? `<div class="acts">${isCar(i) ? '' : `<button class="mini" data-a="moveItem" data-id="${i.id}">移動</button>`}<button class="mini" data-a="editItem" data-id="${i.id}">編集</button></div>` : ''}</div>`; };
  // 入れ物ごとの一覧を作る(準備のときに見やすいように、中身は1段だけ)
  const tree = (x, depth, g) => { if (g.has(x.id) || !visible(x)) return ''; g.add(x.id); return row(x, depth) + (isPouch(x) ? kids(x.id).map(c => tree(c, depth + 1, g)).join('') : ''); };

    if (!rows && todo) return ''; return title + head + (rows || `<div class="sub" style="padding:4px 2px 8px">${emptyMsg}</div>`); };
  let body = '';

  if (loose.length) body += sec(bags.length ? '<div class="sech"><h3>入れ物なし</h3></div>' : '', '', loose, '');

    body += sec(`<div class="sech"><h3>${bagMark(c)}${plain(c.name)}</h3><span class="sub">${n.filter(x => x.done).length}/${n.length}</span>${par ? `<button class="mini" data-a="editItem" data-id="${c.id}">編集</button>` : ''}</div>`, '', ch, 'まだ何もありません'); });
  const chips = bags.length && par ? `<div class="sub" style="margin:2px 0 0">入れる先</div><div class="chips" style="margin:0 0 8px">${[['','かばんなし'], ...bags.map(b => [b.id, bagMark(b) + plain(b.name)])].map(([v,l]) => `<label><input type="radio" name="itembag" data-a="itemBag" data-v="${v}" ${S.itemBag === v ? 'checked' : ''}><span>${l}</span></label>`).join('')}</div>` : '';
  const done = list.filter(i => i.done).length;
  return `<div class="bar"><h2>持ち物リスト</h2><div class="sub"><b>${done}</b> / ${list.length} 準備できた</div></div>
   ${par ? `<form data-f="itemquick" class="qadd"><input type="text" name="name" placeholder="持ち物を入力して「追加」" autocomplete="off"><button class="btn" type="submit">追加</button></form>${chips}` : ''}
   <div class="bar"><div class="seg"><button class="${S.itemFilter === 'all' ? 'on' : ''}" data-a="filterItems" data-v="all">すべて</button><button class="${S.itemFilter === 'todo' ? 'on' : ''}" data-a="filterItems" data-v="todo">まだ</button></div>${par ? '<button class="mini" data-a="addBag">＋入れ物</button>' : ''}</div>
   ${par ? `<div style="display:flex;justify-content:flex-end;gap:6px;margin:-2px 0 4px">${bags.length > 1 ? '<button class="mini" data-a="secOrderModal">↕ 並び順</button>' : ''}<button class="mini" data-a="copyItemsModal">コピー</button></div>` : ''}
   ${body || `<div class="empty">${list.length ? 'ぜんぶ準備できました 🎉' : 'まだ持ち物がありません。<br>キャリーバッグ・ポーチ・車は「＋入れ物」から入れると、中身をまとめられます'}</div>`}`;
}

/* ---- 予算・支出 ---- */
// お土産はお土産リストの金額をそのまま使う(支出には入れないので二重に数えない)
const ECAT = [['move','🚃 交通'],['stay','🏨 宿泊'],['ticket','🎫 チケット・入場'],['food','🍽 食事'],['gift','🎁 お土産'],['other','📦 その他']];
const ECATL = Object.fromEntries(ECAT);
const num = v => (v === '' || v == null || isNaN(Number(v))) ? null : Math.max(0, Math.round(Number(v)));
function budgetCalc(t) {
  const b = t.budget || {}; const bc = b.cats || {};
  const cats = ECAT.map(([k,l]) => {
    let paid = 0, plan = 0;
    if (k === 'gift') S.gifts.forEach(g => { const p = Number(g.price) || 0; if (g.bought) paid += p; else plan += p; });
    else S.expenses.filter(x => (ECATL[x.cat] && x.cat !== 'gift' ? x.cat : 'other') === k).forEach(x => { const a = Number(x.amount) || 0; if (x.paid) paid += a; else plan += a; });
    return { k, l, paid, plan, bud: num(bc[k]) };
  });
  const paid = cats.reduce((a,c) => a + c.paid, 0), plan = cats.reduce((a,c) => a + c.plan, 0);
  const catSum = cats.reduce((a,c) => a + (c.bud || 0), 0);
  const total = num(b.total) ?? (catSum ? catSum : null);
  return { cats, paid, plan, total };
}
const pbar = (paid, plan, total, small) => { const m = Math.max(total || 0, paid + plan, 1); return `<div class="pbar ${small ? 'small' : ''}"><i class="p1" style="width:${paid / m * 100}%"></i><i class="p2" style="width:${plan / m * 100}%"></i></div>`; };
function budgetHTML(t, par) {
  const c = budgetCalc(t); const left = c.total == null ? null : c.total - c.paid - c.plan;
  const f = S.expFilter;
  const list = S.expenses.slice().sort((a,b) => String(a.date || '').localeCompare(String(b.date || '')) || (a.order ?? 0) - (b.order ?? 0));
  const shown = f === 'todo' ? list.filter(x => !x.paid) : f === 'done' ? list.filter(x => x.paid) : list;
  const seg = [['all','すべて'],['todo','これから払う'],['done','払った']].map(([k,l]) => `<button class="${f === k ? 'on' : ''}" data-a="filterExp" data-v="${k}">${l}</button>`).join('');
  const crow = x => { const used = x.paid + x.plan; const r = x.bud == null ? null : x.bud - used;
    return `<div class="crow"><div class="ch"><span>${x.l}</span><span>${yen(used)}${x.bud != null ? ` <span class="sub">/ ${yen(x.bud)}</span>` : ''}</span></div>
     ${x.bud != null || used ? pbar(x.paid, x.plan, x.bud, true) : ''}
     <div class="sub">${x.k === 'gift' ? 'お土産リストから ・ ' : ''}払った ${yen(x.paid)}・これから ${yen(x.plan)}${r != null ? `・<span class="${r < 0 ? 'neg' : ''}">${r < 0 ? 'オーバー ' + yen(-r) : '残り ' + yen(r)}</span>` : ''}</div></div>`; };
  return `<div class="bar"><h2>予算と支出</h2>${par ? '<button class="btn" data-a="addExp">＋支出</button>' : ''}</div>
   <div class="card">${c.total == null ? `<div class="sub">予算はまだ決めていません</div>` : ''}
    <div class="bsum">
     <div><span class="sub">予算</span><b>${c.total == null ? '未設定' : yen(c.total)}</b></div>
     <div><span class="sub">残りの見込み</span><b class="${left != null && left < 0 ? 'neg' : ''}">${left == null ? '-' : (left < 0 ? '−' + yen(-left) : yen(left))}</b></div>
     <div><span class="sub">払った</span><b>${yen(c.paid)}</b></div>
     <div><span class="sub">これから払う</span><b>${yen(c.plan)}</b></div>
    </div>
    ${pbar(c.paid, c.plan, c.total)}<div class="legend"><i style="background:var(--acc);margin-left:0"></i>払った<i style="background:#a8cdef"></i>これから払う</div>
    ${left != null && left < 0 ? '<div class="sub neg" style="margin-top:4px">予算をこえています</div>' : ''}
    ${par ? `<div class="eact"><button class="mini" data-a="editBudget">${c.total == null ? '予算を決める' : '予算を変える'}</button></div>` : ''}</div>
   <div class="card"><h2>種類ごと</h2>${c.cats.map(crow).join('')}</div>
   <div class="sub">お土産はお土産リストの金額を使います(買った=払った、まだ=これから)。お土産をここに入れる必要はありません。</div>
   <div class="bar"><div class="seg">${seg}</div></div>
   ${shown.length ? shown.map(x => { const rv = S.resvs.find(r => r.id === x.resvId);
    return `<div class="item ${x.paid ? '' : ''}"><button class="ck" data-a="toggleExp" data-id="${x.id}" aria-label="払った" ${par ? '' : 'disabled'} style="${x.paid ? 'background:var(--acc);border-color:var(--acc)' : ''}">${x.paid ? '✓' : ''}</button>
     <div class="ib"><div class="ett">${esc(x.title)} ${x.fromResv ? '<span class="tag">予約から</span>' : ''}<span class="tag ${x.paid ? 'ok' : 'warn'}">${x.paid ? '払った' : 'これから'}</span></div>
      <div class="sub">${ECATL[x.cat] && x.cat !== 'gift' ? ECATL[x.cat] : ECATL.other}・${x.date ? fmtD(x.date) : '旅行前・日付なし'}${x.payer ? '・👤 ' + esc(x.payer) : ''}</div>
      ${rv ? `<div class="sub">🎫 ${esc(rv.target)}</div>` : ''}${x.memo ? `<div class="sub">${esc(x.memo)}</div>` : ''}</div>
     <div class="amt">${yen(x.amount)}</div>
     ${par ? `<button class="mini" data-a="editExp" data-id="${x.id}">編集</button>` : ''}</div>`; }).join('') : `<div class="empty">${list.length ? 'この中には支出がありません' : 'まだ支出がありません。<br>「＋支出」から、ホテル代やチケット代などを入れましょう'}</div>`}`;

// Firestoreは1回にまとめて書けるのが500件までなので、450件ごとに分けて順番に保存する
function bigBatch() {
  const bs = [writeBatch(db)]; let n = 0;
  const cur = () => { if (n >= 450) { bs.push(writeBatch(db)); n = 0; } n++; return bs[bs.length - 1]; };
  return { set: (r, d) => cur().set(r, d), update: (r, d) => cur().update(r, d), delete: r => cur().delete(r),
    async commit() { for (const b of bs) await b.commit(); } };
}
async function duplicateTrip(srcId, name, newStart) {
  try {
    const src = S.trips.find(t => t.id === srcId); const off = diffDays(src.start, newStart); const dur = diffDays(src.start, src.end);
    const nref = doc(collection(db,'trips')); const b = bigBatch();
    const parents = [...new Set([...(src.parents || []), S.email])];
    b.set(nref, { name, dest: src.dest || '', start: newStart, end: addDays(newStart, dur), people: src.people || '', notice: src.notice || '', memo: src.memo || '', ...(src.budget ? { budget: src.budget } : {}), ...(src.parkDay ? { parkDay: addDays(src.parkDay, off) } : {}), ...(src.departs ? { departs: Object.fromEntries(Object.entries(src.departs).map(([k,v]) => [addDays(k, off), v])) } : {}), parents, viewers: src.viewers || [], createdBy: S.email, createdAt: serverTimestamp() });
    const [es, cs, its, tks, pks] = await Promise.all([getDocs(collection(db,'trips',srcId,'events')), getDocs(collection(db,'trips',srcId,'candidates')), getDocs(collection(db,'trips',srcId,'items')), getDocs(collection(db,'trips',srcId,'tasks')), getDocs(collection(db,'trips',srcId,'park'))]);
    // パーク: アトラクションは「まだ」に戻す。イベントは日付をずらし、予定の側も新しいIDでつなぎ直す
    const evById = new Map(es.docs.map(d => [d.id, d.data()]));
    pks.docs.forEach(d => { const x = d.data(); const nid = doc(collection(db,'trips',nref.id,'park')).id;
      if (x.kind === 'show') { const date = x.date ? addDays(x.date, off) : ''; b.set(doc(db,'trips',nref.id,'park',nid), { ...x, date });

function exportJson() {
  const t = curTrip(); const strip = o => { const { id, ...r } = o; return { id, ...r }; };
  const data = { exportedAt: new Date().toISOString(), trip: strip({ ...t, createdAt: undefined }), events: S.events, candidates: S.cands, reservations: S.resvs, items: S.items, souvenirs: S.gifts, expenses: S.expenses, tasks: S.tasks, notes: S.notes, park: S.park };
  const name = `trip-${rawName(t.name).replace(/[\\/:*?"<>|\s]+/g, '_')}-${today()}.json`;
  const json = JSON.stringify(data, null, 2);
  // iPhone・iPadでは共有メニューを出す(「"ファイル"に保存」で保存できる)。使えないときはそのままダウンロード
  try {
    const file = new File([json], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: name }).catch(e => { if (e && e.name !== 'AbortError') download(json, name); });
      return;
    }
  } catch (e) {}
  download(json, name);
}
function download(json, name) {
  const url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

// 次の旅行: 今日以降に出発する旅行のうち、いちばん近いもの
function nextTrip() {
  const td = today();
  return S.trips.filter(t => t.start && t.start >= td).sort((a,b) => a.start.localeCompare(b.start))[0] || null;
}
// 旅行の一覧と見出しに出すラベル
function cdTag(t) {
  if (!t || !t.start) return '';
  const n = diffDays(today(), t.start);
  if (n > 0) return `<span class="tag cd">あと${n}日</span>`;
  if (n === 0) return '<span class="tag ok cd">きょう出発</span>';
  if (today() <= (t.end || t.start)) return '<span class="tag ok cd">旅行中</span>';
  return '';
}
// ホーム画面のアイコンの数字(次の旅行まであと何日か。出発の日・旅行がないときは消す)。

let lastBadge = null;
function setIconBadge(n) {
  try {
    if (!('setAppBadge' in navigator)) return;
    lastBadge = n;
    const p = n > 0 ? navigator.setAppBadge(n) : navigator.clearAppBadge();
    if (p && p.catch) p.catch(e => console.error(e));

}
function updateIconBadge() {

/* ---- 毎朝の通知の登録(この端末を送り先にする) ----
   送り先は、保護者になっている旅行の中(trips/{旅行ID}/devices/{トークン})に入れる。
   Firestoreのルールを変えずに使えるため。毎朝 GitHub Actions(notify.js)が送る */
const VAPID_KEY = 'BDYi7vxmu3WNg7dB81D_cgkqsIND5-vyU6KeP0d8dyzQLHioHd0sGZcoZKen3U_BjH050GGD3Il3vRp0ifbho1I';
const TOKEN_KEY = 'trip_push_token', TOKEN_DAY_KEY = 'trip_push_day';
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k,v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} };
const pushState = () => ('Notification' in window) ? Notification.permission : 'none';
const parentTrips = () => S.trips.filter(isParent);
async function pushReady() {
  try { return 'Notification' in window && 'serviceWorker' in navigator && await messagingSupported(); } catch (e) { return false; }
}
async function registerDevice() {
  if (!VAPID_KEY) return 'nokey';
  const reg = await navigator.serviceWorker.register('./firebase-messaging-sw.js');
  const token = await getToken(getMessaging(fbApp), { vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
  if (!token) return null;
  const trips = parentTrips();
  if (!trips.length) return 'notrip';
  const old = lsGet(TOKEN_KEY);
  const b = writeBatch(db);
  for (const t of trips) {
    if (old && old !== token) b.delete(doc(db,'trips',t.id,'devices',old));
    b.set(doc(db,'trips',t.id,'devices',token), { token, email: S.email, updatedAt: new Date().toISOString() });
  }
  await b.commit();
  lsSet(TOKEN_KEY, token); lsSet(TOKEN_DAY_KEY, today());
  return token;
}
// 通知を許可済みなら、1日1回だけ登録を新しくする(新しく作った旅行にも入る。何も表示しない)
async function refreshDevice() {
  try {
    if (!S.user || !S.trips.length || pushState() !== 'granted' || lsGet(TOKEN_DAY_KEY) === today()) return;
    if (!(await pushReady())) return;
    await registerDevice();
  } catch (e) { console.error(e); }
}
// ログアウトするときは、この端末への通知も止める(電波がないときに待ち続けないよう、3秒で先に進む)
async function unregisterDevice() {
  const token = lsGet(TOKEN_KEY);
  const work = (async () => {
    if (!token) return;
    const b = writeBatch(db); parentTrips().forEach(t => b.delete(doc(db,'trips',t.id,'devices',token))); await b.commit();
    if (await pushReady() && pushState() === 'granted') await deleteToken(getMessaging(fbApp));
  })();
  try { await Promise.race([work, new Promise(r => setTimeout(r, 3000))]); } catch (e) { console.error(e); }
  lsSet(TOKEN_KEY, null); lsSet(TOKEN_DAY_KEY, null);
}
async function pushOn() {
  const say = m => { S.pushMsg = m; render(); };
  try {
    if (!('Notification' in window) || !('serviceWorker' in navigator)) return say('この画面では通知を使えません。ホーム画面のアイコンから開いてください。');
    // iPhoneでは、ボタンを押したときに許可を求める必要がある
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') return say('通知が許可されませんでした。設定アプリの「通知」から許可できます。');
    lastBadge = null; updateIconBadge();
    if (!parentTrips().length) return say('アイコンの数字が出るようになりました(毎朝の通知は、保護者になっている旅行がある人に届きます)。');
    if (!(await pushReady())) return say('アイコンの数字は出るようになりましたが、この端末では毎朝の通知を使えません。');
    const r = await registerDevice();
    if (r === 'nokey') return say('アイコンの数字が出るようになりました。毎朝の通知は、Firebaseの準備ができたら使えるようになります。');
    if (!r) return say('登録できませんでした。もう一度押してください。');
    say('この端末で、毎朝の通知とアイコンの数字が使えるようになりました。');
  } catch (e) {
    console.error(e); say('登録できませんでした。ホーム画面から開き直して、もう一度押してください。');
  }
}

     <div class="tplist">${TPL.map(([title, off], i) => `<label class="chk"><input type="checkbox" name="tp${i}" ${have.has(title) ? 'disabled' : ''}><div>${esc(title)}<div class="sub">${have.has(title) ? '追加ずみ' : t.start ? fmtD(tplDue(t, off)) + 'まで' : ''}</div></div></label>`).join('')}</div>
     ${acts('追加する')}</form>`);
  },
  filterExp(d) { S.expFilter = d.v; render(); },
  toggleExp(d) { const x = S.expenses.find(e => e.id === d.id); if (!x) return; fire(updateDoc(exRef(d.id), { paid: !x.paid })); if (x.fromResv && S.resvs.some(r => r.id === x.resvId)) fire(updateDoc(rvRef(x.resvId), { paid: !x.paid })); },
  addExp() { expForm(null); },
  editExp(d) { const x = S.expenses.find(e => e.id === d.id); if (x && x.fromResv && S.resvs.some(r => r.id === x.resvId)) { resvForm(x.resvId); toast('予約から入った支出は、予約の画面で直します'); } else expForm(d.id); },
  delExp(d) { closeModal(); fire(deleteDoc(exRef(d.id))); toast('削除しました'); },
  editBudget() { budgetForm(); },
  print() { closeModal(); document.activeElement && document.activeElement.blur(); printing = true; setTimeout(() => { window.print(); printing = false; render(); }, 30); },
  exportJson() { exportJson(); },
  mclose(d, b, e) { if (b.classList.contains('mback') && e.target !== b) return; closeModal(); }
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  const fn = H[b.dataset.a]; if (fn) { e.stopPropagation(); fn(b.dataset, b, e); }
});
document.addEventListener('change', e => {
  if (e.target.name === 'kind') { const w = document.getElementById('bagSel'); if (w) w.style.display = e.target.value === 'car' ? 'none' : ''; }
  if (e.target.name === 'parkDay' && S.tripId) { fire(updateDoc(doc(db,'trips',S.tripId), { parkDay: e.target.value })); S.parkOpen = true; toast(e.target.value ? fmtD(e.target.value) + 'の予定の中に入れました' : showList().length ? '行く日をえらんでいないので、ショーのある日に出します' : '行く日をなしにしました'); }
  const k = e.target.dataset && e.target.dataset.opt; if (k) { S.sh[k] = e.target.checked; render(); }
});

const setOnline = () => $('#offline').classList.toggle('show', !navigator.onLine);
window.addEventListener('online', setOnline); window.addEventListener('offline', setOnline); setOnline();
window.__S = S;
</script>
